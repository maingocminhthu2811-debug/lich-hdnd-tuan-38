    // PHÂN ĐOẠN 8: BỘ MÁY ĐIỀU HƯỚNG & TƯƠNG TÁC GIAO DIỆN (APP CONTROLLER)
    // ==========================================================================
    const App = {
      activeDayId: "all", // "all" hoặc "t2", "t3", "t4", "t5", "t6", "t7", "cn"
      searchQuery: "",
      carouselIndex: 0,
      activeEvent: null,

      init() {
        this.initTheme();
        this.renderContent();

        // Lắng nghe phím mũi tên Trái / Phải để lướt ngày dễ dàng
        window.addEventListener('keydown', (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
          if (e.key === 'ArrowLeft') {
            this.prevCarousel();
          } else if (e.key === 'ArrowRight') {
            this.nextCarousel();
          }
        });
      },

      initTheme() {
        if (localStorage.getItem('hdnd_theme') === 'dark' || (!('hdnd_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      },

      toggleTheme() {
        document.documentElement.classList.toggle('dark');
        localStorage.setItem('hdnd_theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      },

      setActiveDay(dayId) {
        this.activeDayId = dayId;
        if (dayId !== 'all') {
          const idx = DAYS_DATA.findIndex(d => d.id === dayId);
          if (idx !== -1) this.carouselIndex = idx;
        }
        this.renderContent();
      },

      handleSearch(query) {
        this.searchQuery = query.trim().toLowerCase();
        const clearBtn = document.getElementById('clearSearchBtn');
        if (clearBtn) {
          clearBtn.classList.toggle('hidden', !this.searchQuery);
        }
        this.renderContent();
      },

      clearSearch() {
        const input = document.getElementById('searchInput');
        if (input) input.value = '';
        this.handleSearch('');
      },

      // Lọc danh sách sự kiện theo điều kiện
      getFilteredDays() {
        return DAYS_DATA.map(day => {
          const isDayMatch = (this.activeDayId === 'all' || this.activeDayId === day.id);
          if (!isDayMatch && !this.searchQuery) return null;

          const filteredEvents = day.events.filter(event => {
            if (!this.searchQuery) return true;
            const fullText = (
              event.title + " " +
              event.host + " " +
              event.attendees + " " +
              event.location + " " +
              event.time + " " +
              day.dayName + " " +
              day.dateStr
            ).toLowerCase();
            return fullText.includes(this.searchQuery);
          });

          if (this.searchQuery) {
            return filteredEvents.length > 0 ? { ...day, events: filteredEvents } : null;
          }

          return isDayMatch ? { ...day, events: filteredEvents } : null;
        }).filter(Boolean);
      },

      // Điều hướng Carousel 1a (Lướt qua các ngày)
      prevCarousel() {
        if (this.carouselIndex > 0) {
          this.carouselIndex--;
          this.setActiveDay(DAYS_DATA[this.carouselIndex].id);
        } else {
          this.carouselIndex = DAYS_DATA.length - 1;
          this.setActiveDay(DAYS_DATA[this.carouselIndex].id);
        }
      },

      nextCarousel() {
        if (this.carouselIndex < DAYS_DATA.length - 1) {
          this.carouselIndex++;
          this.setActiveDay(DAYS_DATA[this.carouselIndex].id);
        } else {
          this.carouselIndex = 0;
          this.setActiveDay(DAYS_DATA[this.carouselIndex].id);
        }
      },

        const container = document.getElementById('contentArea');
        const filtered = this.getFilteredDays();

        const statsEl = document.getElementById('statsBadge');

            </div>
          `;
          return;
        }

        // Luôn luôn hiển thị Cấu trúc 1a (Lướt trình chiếu theo ngày)
        this.renderStructure1a(container, filtered);

      showDetail(eventId) {
        let foundEvent = null;
        let foundDay = null;
        for (const day of DAYS_DATA) {
          const ev = day.events.find(e => e.id === eventId);
          if (ev) {
            foundEvent = ev;
            foundDay = day;
            break;
          }
        }
        if (!foundEvent) return;

        this.activeEvent = { ...foundEvent, day: foundDay };

        const badgeEl = document.getElementById('modalTimeBadge');
        if (badgeEl) badgeEl.innerText = `${foundDay.dayName} (${foundDay.dateStr}) • ${foundEvent.time}`;
        
        const titleEl = document.getElementById('modalTitle');
        if (titleEl) titleEl.innerText = foundEvent.title;
        
        // Chủ trì: nếu không có nội dung thì ẩn hàng hoàn toàn
        const hostRow = document.getElementById('modalHostRow');
        const hostEl = document.getElementById('modalHost');
        if (foundEvent.host && foundEvent.host.trim()) {
          if (hostRow) hostRow.classList.remove('hidden');
          if (hostEl) hostEl.innerText = foundEvent.host;
        } else {
          if (hostRow) hostRow.classList.add('hidden');
        }

        const attendeesEl = document.getElementById('modalAttendees');
        if (attendeesEl) attendeesEl.innerText = foundEvent.attendees || '(Theo giấy mời)';

        const locationEl = document.getElementById('modalLocation');
        if (locationEl) locationEl.innerText = foundEvent.location || 'Trụ sở 86 Lê Thánh Tôn';

        const modal = document.getElementById('eventModal');
        if (modal) {
          modal.classList.remove('hidden');
          modal.classList.add('flex');
        }
      },

      closeModal(e) {
        const modal = document.getElementById('eventModal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      },

      // Sao chép nội dung sự kiện vào clipboard
      copyEventDetails() {
        if (!this.activeEvent) return;
        const ev = this.activeEvent;
        const text = `[LỊCH HĐND TP.HCM - TUẦN 38]
Thời gian: ${ev.time} ngày ${ev.day.dayName} (${ev.day.dateStr})
Nội dung: ${ev.title}
Chủ trì: ${ev.host || 'Theo phân công'}
Thành phần: ${ev.attendees}
Địa điểm: ${ev.location}`;
        navigator.clipboard.writeText(text).then(() => {
          alert("Đã sao chép chi tiết sự kiện vào bộ nhớ tạm!");
        });
      },

      // Tạo và tải file .ics cho ngày đang xem
      exportCurrentDayICS() {
        const day = DAYS_DATA[this.carouselIndex] || DAYS_DATA[0];
        let icsContent = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//HDND TPHCM//Lich Tuan 38//VI\nCALSCALE:GREGORIAN\n";
        
        day.events.forEach(ev => {
          const timeParts = ev.time.replace('g', ':').split(':');
          const hour = timeParts[0] ? timeParts[0].padStart(2, '0') : '08';
          const minute = timeParts[1] ? timeParts[1].padStart(2, '0') : '00';
          const dateParts = day.dateStr.includes('-') ? day.dateStr.split('-') : day.dateStr.split('/');
          const year = dateParts[2];
          const month = dateParts[1].padStart(2, '0');
          const date = dateParts[0].padStart(2, '0');
          const dtStart = `${year}${month}${date}T${hour}${minute}00`;

          icsContent += "BEGIN:VEVENT\n";
          icsContent += `SUMMARY:${ev.title.replace(/\n/g, ' ')}\n`;
          icsContent += `DTSTART:${dtStart}\n`;
          icsContent += `LOCATION:${ev.location.replace(/\n/g, ', ')}\n`;
          icsContent += `DESCRIPTION:Chủ trì: ${ev.host || 'Thường trực'}\\nThành phần: ${ev.attendees.replace(/\n/g, ' ')}\n`;
          icsContent += "END:VEVENT\n";
        });

        icsContent += "END:VCALENDAR";

        const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `Lich_HDND_Tuan38_${day.id}.ics`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    };

    // Khởi chạy ứng dụng ngay khi DOM sẵn sàng
    document.addEventListener('DOMContentLoaded', () => {
      App.init();
    });
  </script>
</body>
